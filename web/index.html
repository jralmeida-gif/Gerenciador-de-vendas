<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- viewport-fit=auto (padrão): o iOS mantém o conteúdo dentro da safe area.
       Necessário porque o Flutter Web não lê env(safe-area-inset-*). -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description"
        content="Gestor de Vendas — controle de vendas, portabilidade, prospecção e metas da agência.">

  <!-- PWA / iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Gestor Vendas">
  <meta name="application-name" content="Gestor Vendas">
  <meta name="theme-color" content="#0B4F9E">
  <meta name="format-detection" content="telephone=no">

  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Gestor de Vendas</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overscroll-behavior: none;
      background-color: #0B4F9E;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }
    /* Trava a altura no viewport real do iOS. Sem isso o Flutter recebe uma
       altura errada durante o boot do PWA e o layout nasce deslocado. */
    html, body, body > flt-glass-pane, flutter-view {
      height: 100dvh;
      max-height: 100dvh;
      width: 100vw;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
    }
    @supports not (height: 100dvh) {
      html, body, body > flt-glass-pane, flutter-view {
        height: 100%;
        max-height: 100%;
      }
    }
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #0B4F9E 0%, #073A76 100%);
      z-index: 9999;
      transition: opacity .35s ease;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }
    /* Enquanto "segurar" estiver ativo o splash permanece visível, mesmo que o
       primeiro frame já tenha sido pintado. */
    #splash.segurar { opacity: 1 !important; pointer-events: auto !important; }
    #splash img {
      width: 92px; height: 92px;
      border-radius: 22px;
      box-shadow: 0 12px 34px rgba(0,0,0,.32);
    }
    #splash .nome {
      margin-top: 20px;
      color: #fff;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: .3px;
    }
    #splash .sub {
      margin-top: 6px;
      color: rgba(255,255,255,.7);
      font-size: 12.5px;
      font-weight: 500;
    }
    #splash .barra {
      margin-top: 26px;
      width: 130px; height: 3px;
      background: rgba(255,255,255,.22);
      border-radius: 3px;
      overflow: hidden;
    }
    #splash .barra i {
      display: block;
      width: 40%; height: 100%;
      background: #F58220;
      border-radius: 3px;
      animation: desliza 1.1s ease-in-out infinite;
    }
    @keyframes desliza {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(325%); }
    }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/Icon-192.png" alt="Gestor de Vendas">
    <div class="nome">Gestor de Vendas</div>
    <div class="sub">Carregando seus dados...</div>
    <div class="barra"><i></i></div>
  </div>

  <script>
    // --------------------------------------------------------------------
    // Correção de layout no PWA instalado (iOS / "Adicionar à Tela de Início")
    //
    // O Flutter Web dimensiona a interface pelo tamanho da janela, e não pelas
    // safe areas CSS. No boot de um PWA standalone o iOS reporta uma altura
    // provisória por algumas centenas de ms, então o primeiro layout nasce
    // deslocado e só se corrige quando chega um evento de resize.
    //
    // Aqui disparamos resizes sintéticos logo após o primeiro frame para que
    // o engine recalcule imediatamente, em vez de esperar o usuário rolar.
    // --------------------------------------------------------------------
    (function () {
      var standalone = window.navigator.standalone === true ||
        window.matchMedia('(display-mode: standalone)').matches;

      function forcarRelayout() {
        window.dispatchEvent(new Event('resize'));
        if (window.visualViewport) {
          window.visualViewport.dispatchEvent(new Event('resize'));
        }
      }

      window.addEventListener('flutter-first-frame', function () {
        var s = document.getElementById('splash');
        if (s) {
          // No PWA aguarda o "segurar" liberar; no Safari some de imediato.
          var espera = standalone ? 750 : 0;
          setTimeout(function () {
            s.classList.remove('segurar');
            s.classList.add('hidden');
            setTimeout(function () { s.remove(); }, 400);
          }, espera);
        }

        if (standalone) {
          // Vários passes: o iOS estabiliza a altura em momentos diferentes
          // dependendo do modelo e de estar em cold ou warm start.
          [0, 60, 180, 400, 800].forEach(function (t) {
            setTimeout(forcarRelayout, t);
          });
        }
      });

      // No PWA instalado, segura o splash um pouco mais para que o usuário não
      // veja o layout provisório antes do engine reajustar.
      if (standalone) {
        var s0 = document.getElementById('splash');
        if (s0) s0.classList.add('segurar');
        setTimeout(function () {
          var s1 = document.getElementById('splash');
          if (s1) s1.classList.remove('segurar');
        }, 700);
      }

      // Rotação e retorno do segundo plano também precisam de recálculo.
      window.addEventListener('orientationchange', function () {
        setTimeout(forcarRelayout, 120);
        setTimeout(forcarRelayout, 400);
      });
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) setTimeout(forcarRelayout, 120);
      });
    })();
  </script>
  <script>
    // Salvamento de backup compatível com Safari/iOS.
    (function () {
      function base64ToBytes(base64) {
        var padding = '='.repeat((4 - base64.length % 4) % 4);
        var normalized = (base64 + padding).replace(/-/g, '+').replace(/_/g, '/');
        var raw = atob(normalized);
        var bytes = new Uint8Array(raw.length);
        for (var i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
        return bytes;
      }

      window.gestorSaveBackup = async function (content, filename) {
        var bytes = base64ToBytes(content);
        var blob = new Blob([bytes], { type: 'application/json;charset=utf-8' });
        var file = new File([blob], filename, { type: 'application/json' });

        if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({
            files: [file],
            title: 'Backup do Gestor de Vendas',
            text: 'Escolha Salvar em Arquivos, iCloud Drive, e-mail ou outro destino seguro.'
          });
          return true;
        }

        var url = URL.createObjectURL(blob);
        var link = document.createElement('a');
        link.href = url;
        link.download = filename;
        link.style.display = 'none';
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
        return true;
      };
    })();
  </script>
  <script>
    // Cliente de Web Push. A permissão só é solicitada após o usuário tocar
    // em "Ativar notificações" dentro do aplicativo.
    (function () {
      function base64ToBytes(base64) {
        var padding = '='.repeat((4 - base64.length % 4) % 4);
        var normalized = (base64 + padding).replace(/-/g, '+').replace(/_/g, '/');
        var raw = atob(normalized);
        var bytes = new Uint8Array(raw.length);
        for (var i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
        return bytes;
      }

      window.gestorPushEnable = async function () {
        if (!window.isSecureContext || !('serviceWorker' in navigator) || !('PushManager' in window)) {
          return false;
        }
        var permission = await Notification.requestPermission();
        if (permission !== 'granted') return false;

        var config = await fetch('/api/push/config').then(function (r) { return r.json(); });
        var registration = await navigator.serviceWorker.register('/push/push-sw.js', { scope: '/push/' });
        var subscription = await registration.pushManager.getSubscription();
        if (!subscription) {
          subscription = await registration.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: base64ToBytes(config.publicKey)
          });
        }

        var response = await fetch('/api/push/subscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(subscription.toJSON())
        });
        return response.ok;
      };
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
