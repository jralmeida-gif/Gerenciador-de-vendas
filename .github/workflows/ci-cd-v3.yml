name: Gestor de Vendas v3

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validar Flutter e Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Dependências Flutter
        run: flutter pub get

      - name: Análise estática
        run: flutter analyze

      - name: Testes Flutter
        run: flutter test

      - name: Build web
        run: flutter build web --release

      - name: Dependências do Worker
        working-directory: push_worker
        run: npm install

      - name: TypeScript do Worker e Functions
        working-directory: push_worker
        run: npx tsc --noEmit --skipLibCheck

  deploy:
    name: Publicar v3 no Cloudflare
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Dependências Flutter
        run: flutter pub get

      - name: Build web para publicação
        run: flutter build web --release

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: push_worker/package.json

      - name: Dependências do Worker
        working-directory: push_worker
        run: npm install

      - name: Aplicar migrações D1 v3
        run: npx wrangler d1 migrations apply gestor-vendas-push-v3 --remote --config push_worker/wrangler-v3.toml

      - name: Injetar chave pública VAPID no config temporário
        shell: bash
        run: sed -i "s|__VAPID_PUBLIC_KEY_FROM_GITHUB_SECRET__|$VAPID_PUBLIC_KEY|g" push_worker/wrangler-v3.toml

      - name: Atualizar secret VAPID do Worker
        shell: bash
        run: printf '%s' "$VAPID_PRIVATE_KEY" | npx wrangler secret put VAPID_PRIVATE_KEY --config push_worker/wrangler-v3.toml

      - name: Publicar Worker v3
        run: npx wrangler deploy --config push_worker/wrangler-v3.toml

      - name: Atualizar chave pública VAPID do Pages
        shell: bash
        run: printf '%s' "$VAPID_PUBLIC_KEY" | npx wrangler pages secret put VAPID_PUBLIC_KEY --project-name gestor-vendas-agencia-v3

      - name: Publicar Pages v3
        run: npx wrangler pages deploy build/web --project-name gestor-vendas-agencia-v3 --branch production
